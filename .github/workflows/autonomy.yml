name: Autonomie (collecte, réentraînement, prédictions)

# Pipeline autonome hebdomadaire :
#   1. met à jour les classements ITTF/WTT (snapshots datés → historisation)
#   2. collecte les résultats récents (scraping)
#   3. stocke les cotes bookmaker des matchs à venir
#   4. réentraîne le modèle, PUIS eval-gate : ne promeut que s'il ne régresse pas
#   5. prédit les matchs à venir et rejoue le backtest crédible
#   6. régénère l'artefact web puis committe l'état mis à jour
#   7. alerte Telegram en cas d'échec ou de rejet du retrain
#
# Sources de cotes (secrets de dépôt, toutes facultatives ; au moins une conseillée) :
#   - BetsAPI (recommandé, fiable en CI, bonne couverture TT) : BETSAPI_TOKEN
#   - Betfair Exchange (cotes sans marge)                     : BETFAIR_APP_KEY/USERNAME/PASSWORD
#   - The Odds API (repli)                                    : ODDS_API_KEY
# Alerting (facultatif)   : TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Synchro site (facultatif): SITE_REPO_TOKEN (PAT avec accès en écriture au dépôt du site)
#   -> copie predictions.json vers valentinmartine/public/data/tt_predictions.json (Vercel redéploie)

on:
  schedule:
    - cron: "0 6 * * 1" # tous les lundis 06:00 UTC
  workflow_dispatch: {} # déclenchement manuel possible

permissions:
  contents: write

concurrency:
  group: autonomy
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Mise à jour des classements (snapshots datés → historisation)
        run: |
          python scripts/fetch_wtt_rankings.py || true
          python scripts/fetch_ittf_rankings.py || true
        continue-on-error: true

      - name: Collecte des résultats récents
        run: python scripts/run_scraper.py --days 10 --priority 2
        continue-on-error: true # les IP CI peuvent être bloquées par les sources

      - name: Stockage des cotes bookmaker (BetsAPI / Betfair / The Odds API)
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
        run: python scripts/store_pre_match_odds.py --days 7
        continue-on-error: true

      - name: Sauvegarde du modèle production (pré-retrain)
        run: |
          mkdir -p /tmp/prod
          cp data/lgbm_model.pkl    /tmp/prod/ 2>/dev/null || true
          cp data/lgbm_metrics.json /tmp/prod/ 2>/dev/null || true
          cp data/model_metrics.json /tmp/prod/ 2>/dev/null || true

      - name: Réentraînement du modèle (candidat)
        run: python scripts/train_model.py --model lgbm --shap

      - name: Eval-gate (promotion conditionnelle)
        run: |
          if python scripts/eval_gate.py \
                --candidate data/lgbm_metrics.json \
                --baseline  /tmp/prod/lgbm_metrics.json \
                --metric log_loss --tolerance 0.005; then
            echo "Candidat promu."
          else
            echo "Candidat REJETÉ (régression) — restauration du modèle production."
            cp /tmp/prod/lgbm_model.pkl     data/lgbm_model.pkl     2>/dev/null || true
            cp /tmp/prod/lgbm_metrics.json  data/lgbm_metrics.json  2>/dev/null || true
            cp /tmp/prod/model_metrics.json data/model_metrics.json 2>/dev/null || true
            python -m src.monitoring.notify "Retrain REJETÉ par l'eval-gate (régression log_loss). Modèle production conservé."
          fi

      - name: Prédictions des matchs à venir
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
        run: python scripts/predict_upcoming.py --days 7 --model lgbm
        continue-on-error: true

      - name: Backtest crédible (vraies cotes uniquement)
        run: python scripts/backtest.py --real-odds-only
        continue-on-error: true

      - name: Régénération de l'artefact web
        run: python -m src.export

      - name: Commit de l'état mis à jour
        run: |
          git config user.name "tt-autonomy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tt_matches.db \
                  data/lgbm_model.pkl \
                  data/model_metrics.json \
                  data/lgbm_metrics.json \
                  data/lgbm_shap_importance.csv \
                  data/lgbm_calibration.csv \
                  data/lgbm_calibration_report.json \
                  data/elo_baseline_metrics.json \
                  data/predictions.json
          if git diff --staged --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "chore(autonomie): mise à jour hebdomadaire (données, modèle, prédictions)"
            git push
          fi

      - name: Synchronise le site (valentinmartine.com)
        env:
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          if [ -z "$SITE_REPO_TOKEN" ]; then
            echo "SITE_REPO_TOKEN absent — synchro du site ignorée."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${SITE_REPO_TOKEN}@github.com/ValentinMartine/valentinmartine.git" site_repo
          cp data/predictions.json site_repo/public/data/tt_predictions.json
          cd site_repo
          git config user.name "tt-autonomy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/tt_predictions.json
          if git diff --staged --quiet; then
            echo "Site déjà à jour."
          else
            git commit -m "chore(data): sync prédictions tennis de table (autonomie)"
            git push
          fi
        continue-on-error: true

      - name: Alerte Telegram en cas d'échec du workflow
        if: failure()
        run: python -m src.monitoring.notify "❌ Workflow d'autonomie ÉCHOUÉ (run ${{ github.run_id }}) — voir les logs GitHub Actions."
